<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente Toast | Demo</title>
    <link rel="stylesheet" href="css/componente.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contenedor">
        <h1>Componente Toast</h1>
        <p class="subtitulo">* Notificaciones flotantes reutilizables, con un solo llamado a <code>mostrarToast()</code>.</p>

        <h2>Ejemplos rápidos</h2>
        <div class="grupo-botones">
            <button class="boton-demo" id="btn-exito">✓ Éxito</button>
            <button class="boton-demo" id="btn-error">✕ Error</button>
            <button class="boton-demo" id="btn-advertencia">! Advertencia</button>
            <button class="boton-demo" id="btn-info">i Información</button>
        </div>

        <h2>Pruébalo con tu propio contenido</h2>
        <div class="grupo-formulario">
            <label>Título (opcional)</label>
            <input type="text" id="input-titulo" placeholder="Ej: Pedido confirmado">
        </div>
        <div class="grupo-formulario">
            <label>Mensaje</label>
            <input type="text" id="input-mensaje" placeholder="Escribe el mensaje del toast">
        </div>
        <div class="grupo-formulario">
            <label>Tipo</label>
            <select id="select-tipo">
                <option value="info">Información</option>
                <option value="exito">Éxito</option>
                <option value="error">Error</option>
                <option value="advertencia">Advertencia</option>
            </select>
        </div>
        <div class="grupo-formulario">
            <label>Duración en ms(milisegundos)</label>
            <input type="number" id="input-duracion" value="4000" min="0" step="500">
        </div>
        <button type="button" class="boton-enviar" id="btn-personalizado">Mostrar mi toast</button>
    </div>

    <script src="js/componente.js"></script>

    <script>
        document.getElementById('btn-exito').addEventListener('click', () => {
            mostrarToast({ titulo: '* Un archivo ha sido creado.', mensaje: 'Los cambios se guardaron correctamente.', tipo: 'exito' });
        });

        document.getElementById('btn-error').addEventListener('click', () => {
            mostrarToast({ titulo: '* Algo salió mal.', mensaje: 'No se pudo conectar con el servidor.', tipo: 'error' });
        });

        document.getElementById('btn-advertencia').addEventListener('click', () => {
            mostrarToast({ mensaje: 'Tu sesión está por expirar en 2 minutos.', tipo: 'advertencia' });
        });

        document.getElementById('btn-info').addEventListener('click', () => {
            mostrarToast({ mensaje: 'Hay una nueva actualización disponible.', tipo: 'info', duracion: 5000 });
        });

        document.getElementById('btn-personalizado').addEventListener('click', () => {
            const titulo = document.getElementById('input-titulo').value.trim();
            const mensaje = document.getElementById('input-mensaje').value.trim();
            const tipo = document.getElementById('select-tipo').value;
            const duracion = Number(document.getElementById('input-duracion').value);

            if (!mensaje) {
                mostrarToast({ mensaje: 'Escribe un mensaje antes de mostrar el toast.', tipo: 'error' });
                return;
            }

            mostrarToast({ titulo, mensaje, tipo, duracion });
        });
    </script>
</body>
</html>
